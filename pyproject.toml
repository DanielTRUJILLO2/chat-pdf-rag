[project]
name = "chat-pdf-rag"
version = "0.1.0"
description = "Chat que responde preguntas sobre un PDF (RAG con ChromaDB), evaluado con RAGAS y trazado con LangSmith"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "langsmith>=0.3",
    "ragas==0.3.9",
    "langchain-community<0.4",
    "langchain-anthropic>=0.3",
    "langchain-huggingface>=0.1",
]
